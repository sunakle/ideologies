<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"><title>Левое либертарианство</title><desc>Личная свобода и равный доступ к природным ресурсам. Редакционная тематическая схема.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0L0 6L6 3z" fill="#55766b"/></marker></defs><rect width="720" height="440" fill="#f3f0e7"/><text x="360" y="48" font-family="Arial,sans-serif" font-size="29" fill="#243c35" text-anchor="middle">Левое либертарианство</text><text x="360" y="82" font-family="Arial,sans-serif" font-size="16" fill="#687a70" text-anchor="middle">Личная свобода и равный доступ к природным ресурсам</text><circle cx="140" cy="209" r="16" fill="#5e7193"/><path d="M116 271v-20q0-35 24-35t24 35v20z" fill="#5e7193"/><text x="140" y="342" font-family="Arial,sans-serif" font-size="19" fill="#243c35" text-anchor="middle">Самопринадлежность</text><circle cx="510" cy="235" r="82" fill="#a7cbbd"/><path d="M445 202l47-32 26 35-25 27 32 35-29 41-38-35zM551 194l32 32-19 58-27-34z" fill="#426e59"/><text x="510" y="360" font-family="Arial,sans-serif" font-size="19" fill="#243c35" text-anchor="middle">Общее природное наследие</text><path d="M257 208h100M257 238h100" stroke="#a18455" stroke-width="9"/></svg>