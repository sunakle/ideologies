<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"><title>Импоссибилизм</title><desc>Преобразование общественного устройства. Редакционная тематическая схема.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0L0 6L6 3z" fill="#55766b"/></marker></defs><rect width="720" height="440" fill="#f3f0e7"/><text x="360" y="48" font-family="Arial,sans-serif" font-size="29" fill="#243c35" text-anchor="middle">Импоссибилизм</text><text x="360" y="82" font-family="Arial,sans-serif" font-size="16" fill="#687a70" text-anchor="middle">Преобразование общественного устройства</text><rect x="45" y="130" width="265" height="86" rx="14" fill="#e8ded7"/><text x="177.5" y="180" font-family="Arial,sans-serif" font-size="20" fill="#243c35" text-anchor="middle">Частичные реформы</text><rect x="410" y="130" width="265" height="86" rx="14" fill="#c6e0cf"/><text x="542.5" y="180" font-family="Arial,sans-serif" font-size="20" fill="#243c35" text-anchor="middle">Смена системы</text><path d="M68 268h220M68 288h135" stroke="#b58979" stroke-width="6"/><text x="180" y="338" font-family="Arial,sans-serif" font-size="18" fill="#243c35" text-anchor="middle">Реформы не устраняют</text><text x="180" y="366" font-family="Arial,sans-serif" font-size="18" fill="#243c35" text-anchor="middle">основы капитализма</text><circle cx="490" cy="266" r="16" fill="#466c5c"/><path d="M466 328v-20q0-35 24-35t24 35v20z" fill="#466c5c"/><circle cx="555" cy="266" r="16" fill="#466c5c"/><path d="M531 328v-20q0-35 24-35t24 35v20z" fill="#466c5c"/><circle cx="620" cy="266" r="16" fill="#466c5c"/><path d="M596 328v-20q0-35 24-35t24 35v20z" fill="#466c5c"/><text x="550" y="366" font-family="Arial,sans-serif" font-size="17" fill="#243c35" text-anchor="middle">Осознанное действие большинства</text></svg>