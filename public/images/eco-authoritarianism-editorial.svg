<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"><title>Экоавторитаризм</title><desc>Централизованные экологические решения. Редакционная тематическая схема.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0L0 6L6 3z" fill="#55766b"/></marker></defs><rect width="720" height="440" fill="#f3f0e7"/><text x="360" y="48" font-family="Arial,sans-serif" font-size="29" fill="#243c35" text-anchor="middle">Экоавторитаризм</text><text x="360" y="82" font-family="Arial,sans-serif" font-size="16" fill="#687a70" text-anchor="middle">Централизованные экологические решения</text><rect x="216" y="112" width="288" height="66" rx="14" fill="#d7dbe5"/><text x="360" y="152" font-family="Arial,sans-serif" font-size="20" fill="#243c35" text-anchor="middle">Центр принятия решений</text><path d="M360 186L150 251" fill="none" stroke="#55766b" stroke-width="4" marker-end="url(#a)"/><path d="M360 186L360 251" fill="none" stroke="#55766b" stroke-width="4" marker-end="url(#a)"/><path d="M360 186L570 251" fill="none" stroke="#55766b" stroke-width="4" marker-end="url(#a)"/><rect x="62" y="268" width="176" height="84" rx="14" fill="#c6ded3"/><text x="150" y="317" font-family="Arial,sans-serif" font-size="20" fill="#243c35" text-anchor="middle">Лимиты</text><rect x="272" y="268" width="176" height="84" rx="14" fill="#c6d6df"/><text x="360" y="317" font-family="Arial,sans-serif" font-size="20" fill="#243c35" text-anchor="middle">Контроль</text><rect x="482" y="268" width="176" height="84" rx="14" fill="#ddd3bf"/><text x="570" y="317" font-family="Arial,sans-serif" font-size="20" fill="#243c35" text-anchor="middle">Запреты</text><text x="360" y="402" font-family="Arial,sans-serif" font-size="16" fill="#243c35" text-anchor="middle">Экологические цели через концентрацию политической власти</text></svg>