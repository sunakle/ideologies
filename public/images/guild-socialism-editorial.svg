<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440"><title>Гильдейский социализм</title><desc>Самоуправление работников и общественная координация. Редакционная тематическая схема.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0L0 6L6 3z" fill="#55766b"/></marker></defs><rect width="720" height="440" fill="#f3f0e7"/><text x="360" y="48" font-family="Arial,sans-serif" font-size="29" fill="#243c35" text-anchor="middle">Гильдейский социализм</text><text x="360" y="82" font-family="Arial,sans-serif" font-size="16" fill="#687a70" text-anchor="middle">Самоуправление работников и общественная координация</text><rect x="220" y="120" width="280" height="66" rx="14" fill="#cedae7"/><text x="360" y="160" font-family="Arial,sans-serif" font-size="20" fill="#243c35" text-anchor="middle">Общественная координация</text><path d="M360 190L140 260" fill="none" stroke="#55766b" stroke-width="4" marker-end="url(#a)"/><path d="M360 190L360 260" fill="none" stroke="#55766b" stroke-width="4" marker-end="url(#a)"/><path d="M360 190L580 260" fill="none" stroke="#55766b" stroke-width="4" marker-end="url(#a)"/><rect x="45" y="275" width="190" height="88" rx="14" fill="#d4e9dc"/><text x="140" y="326" font-family="Arial,sans-serif" font-size="20" fill="#243c35" text-anchor="middle">Гильдия труда</text><rect x="265" y="275" width="190" height="88" rx="14" fill="#d8e5d2"/><text x="360" y="326" font-family="Arial,sans-serif" font-size="20" fill="#243c35" text-anchor="middle">Гильдия труда</text><rect x="485" y="275" width="190" height="88" rx="14" fill="#ece1bd"/><text x="580" y="326" font-family="Arial,sans-serif" font-size="20" fill="#243c35" text-anchor="middle">Гильдия труда</text><text x="360" y="403" font-family="Arial,sans-serif" font-size="16" fill="#243c35" text-anchor="middle">Управление производством через профессиональные объединения</text></svg>